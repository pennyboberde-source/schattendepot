name: Probelauf auf Datenkopie

# Plan Volltreffer (Abschnitt 5): Probeläufe mit echten Kursen in einer Kopie der Daten.
# Nichts wird committet, keine Mitteilungen, kein Ereignislauf. Läuft nur von Hand – auch auf einem Bau-Branch,
# bevor dessen Code nach main geht (gh workflow run probelauf.yml --ref <branch>).
on:
  workflow_dispatch:
    inputs:
      art:
        description: 'schluessel (optionale API-Schlüssel prüfen) | schattenbuch | jobs | umzug (Jobs zweimal: Umzug in den privaten Zustand) | alles | tests (tsc, Unit-Tests, Build, E2E unter Linux – wie in der Übernahme-Action) | archiv (Sammelkurse in einen Wegwerf-Ordner)'
        default: schattenbuch
      privat:
        description: 'mit | ohne (so tun, als sei der private Zustand nicht erreichbar)'
        default: mit
      teile:
        description: 'nur bei archiv: krypto,us,gettex,kryptokerzen,ussplits (leer = täglicher Lauf; us holt dann die 3 jüngsten Tage)'
        default: ''

permissions:
  contents: read

jobs:
  probelauf:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          ref: daten
          path: _daten
      - name: Privater Zustand (Schattenbuch, Tagesstände) – nur zum Lesen, der Probelauf arbeitet auf einer Kopie
        uses: actions/checkout@v5
        continue-on-error: true
        with:
          repository: pennyboberde-source/schattendepot-archiv
          ref: zustand
          token: ${{ secrets.ARCHIV_TOKEN }}
          path: _privat
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Tests unter Linux (tsc, Unit, Build, E2E)
        if: github.event.inputs.art == 'tests'
        run: |
          npx tsc --noEmit
          npx vitest run
          npx playwright install --with-deps chromium webkit
          npm run build
          npm run e2e
      - name: Schlüssel prüfen (nur Status, keine Schlüssel und keine Kurse im Log)
        if: github.event.inputs.art == 'schluessel'
        env:
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
        run: node scripts/schluessel-pruefen.mjs
      - name: Archiv-Probe (Sammelkurse in einen Wegwerf-Ordner – nichts wird gesichert, das Log zeigt nur Zählungen)
        if: github.event.inputs.art == 'archiv'
        env:
          MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY }}
          ARCHIV_DIR: ${{ runner.temp }}/archiv-probe
          ARCHIV_NUR: ${{ github.event.inputs.teile }}
          US_MAX_TAGE: 3
        run: |
          mkdir -p "$ARCHIV_DIR"
          [ -n "$ARCHIV_NUR" ] && export US_AB=$(date -u -d "2 years ago" +%F)
          node jobs/archiv.ts
          find "$ARCHIV_DIR" -type f -printf '%P %s Bytes\n'
          node -e "const i=require(process.argv[1]);for(const k of Object.keys(i))console.log(k, typeof i[k]==='object'&&i[k]?Object.keys(i[k]).length+' Einträge':i[k])" "$ARCHIV_DIR/index.json"
      - name: Probelauf
        if: github.event.inputs.art != 'tests' && github.event.inputs.art != 'archiv' && github.event.inputs.art != 'schluessel'
        env:
          ART: ${{ github.event.inputs.art || 'schattenbuch' }}
          PRIVAT: ${{ github.event.inputs.privat == 'ohne' && 'ohne-privat' || '' }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
          ALPHAVANTAGE_API_KEY: ${{ secrets.ALPHAVANTAGE_API_KEY }}
          OPENFIGI_API_KEY: ${{ secrets.OPENFIGI_API_KEY }}
        run: node jobs/probelauf.ts "$ART" $PRIVAT
