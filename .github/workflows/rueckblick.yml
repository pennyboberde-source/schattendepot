name: Rückblick und Musterprüfung

# Plan Volltreffer V3 (mit Sprung-Zensus aus V2): rechnet über die ganze Kursgeschichte im PRIVATEN Archiv, ob eine
# 1.000-€-Order ein Volltreffer geworden wäre, und prüft Merkmale, Kombinationen und Hypothesen in zwei Zeiträumen.
# Öffentlich (Datenzweig lernen/muster/) gehen nur verdichtete Kennzahlen; der Zensus mit Werten bleibt im Archiv.
# Täglich 05:45 UTC (seit 21.11.2026; 19.–20.11. 01:20 – Fehler: Massive stellt den US-Tag X erst gegen 05:00–05:40 UTC
# am Tag X+1 bereit, um 01:20 sah der Rückblick nur X−1, die sichtbaren Orders zu X erschienen erst nach ihrem Einstieg).
# Der erste Schritt wartet bis zu 60 Min. auf den US-Tag im Archiv (jobs/warte-us-tag.ts). Eigene Concurrency-Gruppe:
# in „archiv-schreiben“ hätte er den Archivlauf, auf den er wartet, blockiert. Oder von Hand. Dazu Trefferbuch und Signal-Prüfung: Welche Signale der Datenkrake
# (Datenzweig signale/tag/) gingen den Sprüngen voraus?
on:
  schedule:
    - cron: '45 5 * * *'
  workflow_dispatch:
    inputs:
      probe:
        description: 'Probe: Code des gewählten Branchs rechnen, nichts sichern, nichts veröffentlichen'
        type: boolean
        default: false
      modellregel_ab:
        description: 'Nur Probe: erster Tag der Modell-Regel früher setzen (JJJJ-MM-TT), um den Ablauf zu prüfen'
        type: string
        default: ''

permissions:
  contents: read

jobs:
  rechnen:
    runs-on: ubuntu-latest
    environment:
      name: live
      deployment: false
    timeout-minutes: 300
    concurrency:
      # die Probe schreibt nicht ins Archiv und stört dessen Warteschlange nicht
      group: ${{ inputs.probe && 'rueckblick-probe' || 'rueckblick' }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.probe && github.ref || 'main' }}
      - uses: actions/checkout@v5
        with:
          ref: daten
          path: _daten
      - uses: actions/checkout@v5
        with:
          repository: pennyboberde-source/schattendepot-archiv
          token: ${{ secrets.ARCHIV_TOKEN }}
          path: _archiv
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Auf den jüngsten US-Tag im Archiv warten
        if: ${{ !inputs.probe }}
        env:
          WARTE_MINUTEN: 60
        run: node jobs/warte-us-tag.ts
      - name: Rückblick rechnen
        env:
          NODE_OPTIONS: --max-old-space-size=8192
          DATEN_DIR: ${{ runner.temp }}/muster
          SIGNALE_DIR: _daten
          MODELLREGEL_AB: ${{ inputs.probe && inputs.modellregel_ab || '' }}
        run: |
          mkdir -p "$DATEN_DIR/lernen/muster"
          # Hypothesen- und Muster-Buch werden nur angehängt → bisherigen Stand mitnehmen
          for b in hypothesen.json muster-buch.json zeitreise-buch.json modell-wahl.json; do [ -f "_daten/lernen/muster/$b" ] && cp "_daten/lernen/muster/$b" "$DATEN_DIR/lernen/muster/"; done
          node jobs/rueckblick.ts
      - name: Probe – Rangliste zeigen
        if: ${{ inputs.probe }}
        env:
          DATEN_DIR: ${{ runner.temp }}/muster
        run: node scripts/rangliste-zeigen.mjs
      - name: Zensus und Prüfung im privaten Archiv sichern
        if: ${{ !inputs.probe }}
        run: bash scripts/archiv-sichern.sh "Rückblick $(date -u +%Y-%m-%dT%H:%MZ)"
      - uses: actions/upload-artifact@v4
        if: ${{ !inputs.probe }}
        with:
          name: muster
          path: ${{ runner.temp }}/muster
          retention-days: 3

  veroeffentlichen:
    needs: rechnen
    if: ${{ !inputs.probe }}
    runs-on: ubuntu-latest
    environment:
      name: live
      deployment: false
    timeout-minutes: 5
    permissions:
      contents: write
    concurrency:
      group: daten-schreiben
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/checkout@v5
        with:
          ref: daten
          path: _daten
          ssh-key: ${{ secrets.SCHREIB_SCHLUESSEL }}
      - uses: actions/download-artifact@v4
        with:
          name: muster
          path: _daten
      - name: Daten sichern
        run: bash scripts/daten-sichern.sh "Rückblick $(date -u +%Y-%m-%dT%H:%MZ)"
