name: Umzug in den Tresor (einmalig)

# Einmaliger Lauf der Härtung vom 15.11.2026, wird danach gelöscht:
#   1. kopiert die Geheimnisse von der Repo-Ebene in die Umgebung „live“ (nur main und bau/* dürfen sie lesen),
#   2. erzeugt den Schreibschlüssel der Jobs (Deploy-Key mit Schreibrecht; der private Teil liegt nur im Tresor),
#   3. prüft an der Schutzregel des Test-Branches tresor-test: der Schlüssel darf schreiben, das Token der Action nicht.
# Kein Wert erscheint im Log; ausgegeben werden nur Namen und ja/nein.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  umzug:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Geheimnisse in den Tresor kopieren
        env:
          GH_TOKEN: ${{ secrets.UMZUG_TOKEN }}
          ALPHAVANTAGE_API_KEY: ${{ secrets.ALPHAVANTAGE_API_KEY }}
          ARCHIV_TOKEN: ${{ secrets.ARCHIV_TOKEN }}
          COINALYZE_API_KEY: ${{ secrets.COINALYZE_API_KEY }}
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
          MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY }}
          PUSH_SUBSCRIPTION: ${{ secrets.PUSH_SUBSCRIPTION }}
          SEC_KONTAKT: ${{ secrets.SEC_KONTAKT }}
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$GH_TOKEN" ]; then echo "::error::UMZUG_TOKEN fehlt"; exit 1; fi
          for name in ALPHAVANTAGE_API_KEY ARCHIV_TOKEN COINALYZE_API_KEY COINGECKO_API_KEY FINNHUB_API_KEY FMP_API_KEY MASSIVE_API_KEY PUSH_SUBSCRIPTION SEC_KONTAKT TWELVEDATA_API_KEY VAPID_PRIVATE_KEY; do
            if [ -z "${!name}" ]; then echo "::error::$name ist auf Repo-Ebene leer"; exit 1; fi
            printf '%s' "${!name}" | gh secret set "$name" --env live --repo "$GITHUB_REPOSITORY"
            echo "$name: in den Tresor kopiert"
          done

      - name: Schreibschlüssel erzeugen und an der Test-Schutzregel prüfen
        env:
          GH_TOKEN: ${{ secrets.UMZUG_TOKEN }}
          ACTION_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          d=$(mktemp -d)
          trap 'rm -rf "$d"' EXIT
          ssh-keygen -q -t ed25519 -N '' -C 'schattendepot-jobs' -f "$d/k"
          gh secret set SCHREIB_SCHLUESSEL --env live --repo "$GITHUB_REPOSITORY" < "$d/k"
          echo "SCHREIB_SCHLUESSEL: im Tresor"
          gh repo deploy-key add "$d/k.pub" --allow-write --title 'Schreibschluessel der Jobs (Tresor live)' --repo "$GITHUB_REPOSITORY" > /dev/null
          echo "Deploy-Key mit Schreibrecht: angelegt"
          sleep 5
          export GIT_SSH_COMMAND="ssh -i $d/k -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
          ssh_url="git@github.com:$GITHUB_REPOSITORY.git"
          git init -q "$d/t"
          cd "$d/t"
          git config user.name schattendepot-bot
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -q --allow-empty -m 'Tresor-Probe 1'
          git push -q "$ssh_url" HEAD:refs/heads/tresor-test
          git commit -q --allow-empty -m 'Tresor-Probe 2'
          if git push -q "$ssh_url" HEAD:refs/heads/tresor-test; then echo "Schlüssel darf trotz Schutzregel schreiben: ja"; else echo "::error::Schlüssel wurde abgewiesen"; exit 1; fi
          git commit -q --allow-empty -m 'Tresor-Probe 3'
          if git push -q "https://x-access-token:${ACTION_TOKEN}@github.com/$GITHUB_REPOSITORY.git" HEAD:refs/heads/tresor-test 2>/dev/null; then
            echo "::error::Token der Action durfte schreiben – Schutzregel greift nicht"; exit 1
          else
            echo "Token der Action abgewiesen: ja"
          fi

  pruefen:
    needs: umzug
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: live
      deployment: false
    steps:
      - name: Schreibschlüssel aus dem Tresor schreibt auf tresor-test, danach aufräumen
        env:
          SCHLUESSEL: ${{ secrets.SCHREIB_SCHLUESSEL }}
        run: |
          set -euo pipefail
          d=$(mktemp -d)
          trap 'rm -rf "$d"' EXIT
          if [ -z "$SCHLUESSEL" ]; then echo "::error::SCHREIB_SCHLUESSEL fehlt im Tresor"; exit 1; fi
          printf '%s\n' "$SCHLUESSEL" > "$d/k"
          chmod 600 "$d/k"
          export GIT_SSH_COMMAND="ssh -i $d/k -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
          ssh_url="git@github.com:$GITHUB_REPOSITORY.git"
          git clone -q --depth 1 --branch tresor-test "$ssh_url" "$d/t"
          cd "$d/t"
          git config user.name schattendepot-bot
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -q --allow-empty -m 'Tresor-Probe 4'
          if git push -q origin HEAD:refs/heads/tresor-test; then echo "Schlüssel aus dem Tresor darf schreiben: ja"; else echo "::error::Schlüssel aus dem Tresor abgewiesen"; exit 1; fi
          git push -q origin --delete tresor-test
          echo "tresor-test gelöscht"
