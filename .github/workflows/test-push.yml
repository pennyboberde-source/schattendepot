name: Test-Push

# Schickt eine Test-Mitteilung ans iPad (manuell starten: Actions → Test-Push → Run workflow).
on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: daten-schreiben
  cancel-in-progress: false

jobs:
  test-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          ref: daten
          path: _daten
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Test-Push senden
        env:
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          PUSH_SUBSCRIPTION: ${{ secrets.PUSH_SUBSCRIPTION }}
        run: node jobs/test-push.ts
      - name: Daten sichern
        run: bash scripts/daten-sichern.sh "Test-Push"
