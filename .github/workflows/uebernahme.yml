name: Übernahme Claude-Lauf

# Ein Routinen-Lauf pusht seine Entscheidung auf claude/lauf-<datum>-<typ> (Branch von main abgezweigt).
# Diese Action prüft sie gegen schema/entscheidung.schema.json, übernimmt sie in den daten-Branch,
# sendet die Pushes, deployt und löscht den Branch.
#
# Sicherheit (Härtung 15.11.2026): Diese Datei läuft immer aus main, nie aus dem Routinen-Branch – bei einem
# Push-Auslöser nähme GitHub die Workflow-Datei aus dem Branch, mit den Geheimnissen. Ausgelöst wird sie
#   sofort über workflow_run, wenn „Routinen-Ergebnis gemeldet“ (routine-meldung.yml: Push auf claude/lauf-*, ohne
#   Geheimnisse und ohne Rechte) gelaufen ist – workflow_run nimmt immer die Datei aus main;
#   als Rückfall per Zeitplan (GitHub verzögert oder lässt Zeitpläne oft aus) und von Hand.
#   suchen      (nur lesen, ohne Geheimnisse)  gibt es Routinen-Branches? Wartet bis zu 12 Min., bis kein anderer
#                                              Daten-Lauf läuft oder wartet – so wird nie ein wartender Sammler oder
#                                              Wächter aus der Warteschlange verdrängt
#   uebernahme  (schreiben)                    läuft nur dann
# Zusätzlich übernimmt jeder Kurswächter-Lauf liegengebliebene Branches gleich zu Beginn (jobs/lib/uebernahme.ts).
on:
  workflow_run:
    workflows: ['Routinen-Ergebnis gemeldet']
    types: [completed]
  schedule:
    # Rückfall alle 10 Min. von 05 bis 23 Uhr UTC (krumme Minuten); nachts übernimmt der Kurswächter
    - cron: '3,13,23,33,43,53 5-23 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  suchen:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    outputs:
      los: ${{ steps.suchen.outputs.los }}
    steps:
      - name: Routinen-Branches und freie Warteschlange
        id: suchen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          branches=$(git ls-remote --heads "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" 'claude/lauf-*' | wc -l)
          echo "Routinen-Branches: $branches"
          if [ "$branches" -eq 0 ]; then echo "los=nein" >> "$GITHUB_OUTPUT"; exit 0; fi
          # Läuft oder wartet ein anderer Daten-Workflow? Dann nicht anstellen (sonst würde ein wartender Lauf verdrängt),
          # sondern bis zu 12 Min. warten; danach übernimmt der nächste Zeitplan-Lauf oder der Kurswächter.
          besetztZaehlen() {
            local summe=0 s n
            for s in queued pending waiting requested in_progress; do
              n=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?status=$s&per_page=50" \
                --jq "[.workflow_runs[] | select(.id != $GITHUB_RUN_ID) | select(.path | (endswith(\"/deploy.yml\") or endswith(\"/probelauf.yml\") or endswith(\"/archiv.yml\") or endswith(\"/historie.yml\") or endswith(\"/routine-meldung.yml\")) | not)] | length")
              if [ $? -ne 0 ] || [ -z "$n" ]; then n=1; fi
              summe=$((summe + n))
            done
            echo "$summe"
          }
          for versuch in $(seq 1 37); do
            besetzt=$(besetztZaehlen)
            if [ "$besetzt" -eq 0 ] || [ "$versuch" -eq 37 ]; then break; fi
            echo "Andere Daten-Läufe aktiv oder wartend: $besetzt – warte 20 s"
            sleep 20
          done
          echo "Andere Daten-Läufe aktiv oder wartend: $besetzt"
          if [ "$besetzt" -eq 0 ]; then echo "los=ja" >> "$GITHUB_OUTPUT"; else echo "los=nein" >> "$GITHUB_OUTPUT"; fi

  uebernahme:
    needs: suchen
    if: needs.suchen.outputs.los == 'ja' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: live
      deployment: false
    timeout-minutes: 10
    permissions:
      contents: write
      actions: write
    concurrency:
      group: daten-schreiben
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/checkout@v5
        with:
          ref: daten
          path: _daten
          ssh-key: ${{ secrets.SCHREIB_SCHLUESSEL }}
      - name: Privater Zustand (Schattenbuch, Tagesstände) – scheitert der Zugang, läuft der Job ohne ihn weiter
        uses: actions/checkout@v5
        continue-on-error: true
        with:
          repository: pennyboberde-source/schattendepot-archiv
          ref: zustand
          token: ${{ secrets.ARCHIV_TOKEN }}
          path: _privat
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Übernahme
        env:
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          PUSH_SUBSCRIPTION: ${{ secrets.PUSH_SUBSCRIPTION }}
        run: node jobs/uebernahme.ts
      - name: Daten sichern
        id: sichern
        run: bash scripts/daten-sichern.sh "Übernahme Claude-Lauf $(date -u +%Y-%m-%dT%H:%MZ)"
      - name: Privaten Zustand sichern
        if: always()
        run: bash scripts/privat-sichern.sh "Übernahme $(date -u +%Y-%m-%dT%H:%MZ)"
      - name: Deploy anstoßen
        if: steps.sichern.outputs.geaendert == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main
