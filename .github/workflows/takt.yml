name: Takt Kurswächter

# Taktgeber für ALLE Zeitpläne (seit 18.11.2026; vorher nur der Kurswächter werktags). GitHub lässt Zeitpläne oft stark
# verzögert oder ganz aus (17./18.11.: Rückblick 05:40, Sammler, Wächter und die Takt-Zündung selbst fielen aus).
# jobs/takt.ts läuft rund um die Uhr als langer Job, prüft alle 90 s die in config/takt.json genannten Workflows gegen
# ihre eigenen Cron-Zeilen und stößt verpasste Läufe an (keine Doppelläufe: ein Lauf seit dem fälligen Zeitpunkt zählt).
# Nach ~5:40 Std. stößt er sich selbst neu an; die Zeitpläne unten sind nur Zündung, falls die Kette reißt.
# Ohne Geheimnisse, nur Leserechte am Code und Startrechte für Workflows; nur aus main. Kosten 0 € (öffentliches Repo).
# Die Übernahme zählt diesen Lauf nicht als „besetzt“.
on:
  schedule:
    - cron: '41 */2 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: takt
  cancel-in-progress: false

jobs:
  takt:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: |
            core/takt.ts
            jobs/takt.ts
            config/takt.json
            .github/workflows
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Taktgeber
        env:
          GH_TOKEN: ${{ github.token }}
        run: node jobs/takt.ts
