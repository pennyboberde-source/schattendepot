name: Kurswächter

# Alle 15 Min. Mo–Fr. Cron läuft in UTC: 06–21 Uhr UTC deckt 08–22 Uhr Berlin in Sommer- und Winterzeit ab;
# der Job prüft Handelstag/-zeit selbst (core/kalender.ts). Außerhalb der Börsenzeit (nachts, Wochenende)
# alle 30 Min. nur Krypto direkt (S2, rund um die Uhr); ohne Krypto-Positionen endet der Lauf sofort.
on:
  schedule:
    - cron: '*/15 6-21 * * 1-5'
    - cron: '7,37 0-5,22,23 * * *'
    - cron: '7,37 6-21 * * 0,6'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: daten-schreiben
  cancel-in-progress: false

jobs:
  waechter:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          ref: daten
          path: _daten
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Kurswächter
        env:
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          PUSH_SUBSCRIPTION: ${{ secrets.PUSH_SUBSCRIPTION }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
          ALPHAVANTAGE_API_KEY: ${{ secrets.ALPHAVANTAGE_API_KEY }}
          ROUTINE_FIRE_URL: ${{ secrets.ROUTINE_FIRE_URL }}
          ROUTINE_FIRE_TOKEN: ${{ secrets.ROUTINE_FIRE_TOKEN }}
        run: node jobs/waechter.ts
      - name: Daytrading (eigener Bereich, Fehler stoppen den Wächter nicht)
        continue-on-error: true
        env:
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          PUSH_SUBSCRIPTION: ${{ secrets.PUSH_SUBSCRIPTION }}
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
          OPENFIGI_API_KEY: ${{ secrets.OPENFIGI_API_KEY }}
        run: node jobs/daytrading.ts
      - name: Daten sichern
        id: sichern
        run: bash scripts/daten-sichern.sh "Kurswächter $(date -u +%Y-%m-%dT%H:%MZ)"
      - name: Deploy anstoßen (bei neuen Ereignissen oder einmal pro Stunde)
        if: steps.sichern.outputs.geaendert == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # nachts/am Wochenende nur bei neuen Ereignissen (sonst stündlich während der Börsenzeit)
          if git -C _daten diff HEAD~1 --name-only | grep -q 'ereignisse.jsonl' || { [ "$(date -u +%M)" -lt 15 ] && [ "$(date -u +%u)" -le 5 ] && [ "$(date -u +%H)" -ge 6 ] && [ "$(date -u +%H)" -le 21 ]; }; then
            gh workflow run deploy.yml --ref main
          fi
